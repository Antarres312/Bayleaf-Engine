[package]
name = "bayleaf-ui-egui"
description = "L6: the egui editor shell. Panels change engine state only through registered commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bayleaf-core = { workspace = true }
bayleaf-engine = { workspace = true }
bayleaf-interface = { workspace = true }
gilrs = { workspace = true }
bayleaf-render = { workspace = true }
craft-flow = { workspace = true }
craft-fonts-build = { workspace = true }
# Translations: the craft-i18n catalogs (embedded when CRAFT_I18N_DIR names a checkout) and lookups.
craft-i18n = { workspace = true }
# Markdown files in the Inspector, read by the Craft apps' shared parser.
craft-markdown = { workspace = true }
# system_fonts: installed fonts fill in scripts the embedded faces lack (desktop only).
craft-ui = { workspace = true, features = ["system_fonts"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }
ron = { workspace = true }
png = { workspace = true }
# Assembles small script modules for Inspector tests.
wat = { workspace = true }
serde = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Embeds craft-fonts faces when CRAFT_FONTS_DIR names a craft-fonts checkout.
craft-fonts-build = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# wgpu: the editor drawn offscreen with its real renderer (GPU tests and review pictures).
egui_kittest = { workspace = true, features = ["wgpu"] }
pollster = { workspace = true }
png = { workspace = true }
# The app gets fonts through eframe; headless UI tests need them too.
egui = { workspace = true, features = ["default_fonts"] }
