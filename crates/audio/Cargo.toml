[package]
name = "bayleaf-audio"
description = "L4: sound for play mode: decodes clips (craft-audio), mixes voices and plays them on the default output (cpal). Opt-in: the engine's `audio` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bayleaf-core = { workspace = true }
craft-audio = { workspace = true, features = ["decode-native", "vorbis-decode", "flac-decode"] }
craft-audio-dsp = { workspace = true }
cpal = { workspace = true }

# In a browser, sound goes out through the page's Web Audio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[lints]
workspace = true

[dev-dependencies]
# A FLAC file to decode, written in the test.
craft-audio = { workspace = true, features = ["flac-encode"] }
