[package]
name = "bayleaf-engine"
description = "L5: editing session, command registry, undo history and play mode."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Optional world streaming. Small or specialised projects leave it off.
streaming = ["dep:bayleaf-streaming"]

[dependencies]
bayleaf-core = { workspace = true }
bayleaf-scene = { workspace = true }
bayleaf-render = { workspace = true }
bayleaf-streaming = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
