[package]
name = "bayleaf-core"
description = "L0: ids, handles, errors and math re-exports shared by every Bayleaf crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
web-time = { workspace = true }

# In a browser, randomness comes from the page (crypto.getRandomValues); `.cargo/config.toml` picks
# that backend for the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
