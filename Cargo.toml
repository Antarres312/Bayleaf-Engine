[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Example game scripts build for WebAssembly in their own workspace (`cargo xtask scripts`).
exclude = ["scripts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Bayleaf crates are added here when a crate first depends on them; the layer map is xtask/src/layers.rs.
bayleaf-core = { path = "crates/core" }
bayleaf-ecs = { path = "crates/ecs" }
bayleaf-scene = { path = "crates/scene" }
bayleaf-physics = { path = "crates/physics" }
bayleaf-graph = { path = "crates/graph" }
bayleaf-assets = { path = "crates/assets" }
bayleaf-render = { path = "crates/render" }
bayleaf-script = { path = "crates/script" }
bayleaf-streaming = { path = "crates/streaming" }
bayleaf-engine = { path = "crates/engine" }
bayleaf-ui-egui = { path = "crates/ui-egui" }
bayleaf-automation = { path = "crates/automation" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
glam = { version = "0.30", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence"] }
egui_dock = { version = "0.22", features = ["serde"] }
# Same version eframe uses for its saved state; it keeps non-finite floats that JSON cannot.
ron = "0.12"
egui = { version = "0.37", default-features = false }
egui_kittest = "0.37"
toml = "0.9"
getrandom = "0.3"
# Pure-Rust WebAssembly interpreter: runs inside the web build too, with fuel metering.
wasmi = "2"
wat = "1"
# Must match the wgpu version egui-wgpu uses.
wgpu = "30"
egui-wgpu = { version = "0.37", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
# Rigid-body physics (Apache-2.0).
rapier3d = "0.36"
rapier3d-f64 = "0.36"
# Gamepads (MIT OR Apache-2.0).
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# JPEG images (MIT OR Apache-2.0 OR Zlib).
zune-jpeg = "0.5"
zune-core = "0.5"
# glTF 2.0 models (MIT OR Apache-2.0). Only the reader: images and text-embedded buffers are not used.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
