[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Example game scripts build for WebAssembly in their own workspace (`cargo xtask scripts`).
exclude = ["scripts"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Bayleaf crates are added here when a crate first depends on them; the layer map is xtask/src/layers.rs.
bayleaf-core = { path = "crates/core" }
bayleaf-ecs = { path = "crates/ecs" }
bayleaf-scene = { path = "crates/scene" }
bayleaf-physics = { path = "crates/physics" }
bayleaf-audio = { path = "crates/audio" }
bayleaf-gameplay = { path = "crates/gameplay" }
bayleaf-graph = { path = "crates/graph" }
bayleaf-interface = { path = "crates/interface" }
bayleaf-assets = { path = "crates/assets" }
bayleaf-render = { path = "crates/render" }
bayleaf-script = { path = "crates/script" }
bayleaf-script-sdk = { path = "crates/script-sdk" }
bayleaf-particles = { path = "crates/particles" }
bayleaf-streaming = { path = "crates/streaming" }
bayleaf-engine = { path = "crates/engine" }
bayleaf-ui-egui = { path = "crates/ui-egui" }
bayleaf-automation = { path = "crates/automation" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
glam = { version = "0.30", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence"] }
egui_dock = { version = "0.22", features = ["serde"] }
# Shared egui controls of the Craft apps (storytold/craft-libs). Every craft-libs crate stays at one
# rev merged on its main branch; moving the rev is a change of its own.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-markdown = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-flow = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-audio-dsp = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1", default-features = false, features = ["obj"] }
craft-exr = { git = "https://github.com/storytold/craft-libs", rev = "c60e7a20063313b80a994075adb4f797b24ab4f1", features = ["decode"] }
# Sound output on Windows, macOS and Linux (Apache-2.0).
cpal = "0.15"
# Same version eframe uses for its saved state; it keeps non-finite floats that JSON cannot.
ron = "0.12"
egui = { version = "0.37", default-features = false }
egui_kittest = "0.37"
toml = "0.9"
# Edits a project's script workspace manifest, keeping its formatting and comments.
toml_edit = "0.25"
# Moves deleted project files to the system's Recycle Bin, so they can be restored.
trash = "5"
getrandom = "0.3"
# Pure-Rust WebAssembly interpreter: runs inside the web build too, with fuel metering.
wasmi = "2"
# Compiles scripts to machine code for exported desktop games (the `compiled` feature of bayleaf-script).
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "std"] }
wat = "1"
# Must match the wgpu version egui-wgpu uses.
wgpu = "30"
egui-wgpu = { version = "0.37", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
# Rigid-body physics (Apache-2.0).
rapier3d = "0.36"
rapier3d-f64 = "0.36"
# Gamepads (MIT OR Apache-2.0).
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# JPEG images (MIT OR Apache-2.0 OR Zlib).
zune-jpeg = "0.5"
zune-core = "0.5"
# glTF 2.0 models (MIT OR Apache-2.0). Only the reader: images and text-embedded buffers are not used.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# craft-ui is built against the Craft apps' egui fork and its winit (fork-only text input and
# right-to-left APIs). Cargo does not carry a dependency's patches over, so every app repeats them,
# at the same commits craft-libs uses at its pinned rev.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
