[package]
name = "bayleaf-engine"
description = "L5: editing session, command registry, undo history and play mode."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Optional world streaming. Small or specialised projects leave it off.
streaming = ["dep:bayleaf-streaming"]
# Rigid-body physics in play mode (Rapier). Projects without physics leave it off.
physics = ["dep:bayleaf-physics"]
# Gameplay roles (Player Control). Projects without them leave it off.
gameplay = ["dep:bayleaf-gameplay", "bayleaf-gameplay/controller", "bayleaf-gameplay/rules"]
# Sound in play mode (cpal output, craft-audio decoding). Projects without sound leave it off.
audio = ["dep:bayleaf-audio"]
# Scripts compiled to machine code (wasmtime) in play mode, for exported desktop games.
compiled-scripts = ["bayleaf-script/compiled"]

[dependencies]
bayleaf-core = { workspace = true }
bayleaf-graph = { workspace = true }
bayleaf-interface = { workspace = true }
bayleaf-scene = { workspace = true }
bayleaf-render = { workspace = true }
bayleaf-animation = { workspace = true }
bayleaf-script = { workspace = true }
bayleaf-particles = { workspace = true }
bayleaf-streaming = { workspace = true, optional = true }
bayleaf-physics = { workspace = true, optional = true }
bayleaf-audio = { workspace = true, optional = true }
bayleaf-gameplay = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml_edit = { workspace = true }

# The Recycle Bin, for deleting assets; a browser has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
trash = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
wat = { workspace = true }
