[package]
name = "bayleaf-gameplay"
description = "L4: opt-in gameplay roles. Each role is a cargo feature; projects can drop or replace any of them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bayleaf-core = { workspace = true, optional = true }
bayleaf-scene = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
# Player Control: input actions steer a Character; the camera follows.
controller = ["dep:bayleaf-core", "dep:bayleaf-scene"]
# Game Rules: the player appears at the Player Start, starts over after a fall, and the time limit ends the game.
rules = ["dep:bayleaf-core", "dep:bayleaf-scene"]

[lints]
workspace = true
