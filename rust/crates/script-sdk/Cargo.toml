[package]
name = "bayleaf-script-sdk"
description = "Rust SDK for Bayleaf game scripts (WebAssembly guests). See docs/script-abi.md."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

# The FFI boundary to the host needs `unsafe`; it is confined to `src/abi.rs` (AGENTS.md).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
