# The benchmark's Rust scripts, built for wasm32-unknown-unknown (see bench/README.md).
# A workspace of their own, like scripts/, so the engine workspace never compiles them for the host
# as libraries; the benchmark builds the same sources into itself for native mode.
[workspace]
resolver = "3"
members = ["spin", "bob", "follow", "empty", "fields", "spin-many", "bob-many", "follow-many"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bayleaf-script-sdk = { path = "../../crates/script-sdk" }

# As scripts/ builds the example scripts.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
